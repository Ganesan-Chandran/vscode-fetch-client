name: Release Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------
  # Build
  # ---------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z"
            exit 1
          fi

          if [[ "$PKG_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Input version $RELEASE_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package VSIX
        run: npx --no-install vsce package --no-dependencies -o fetch-client.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: fetch-client.vsix
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------
  # Release
  # ---------------------------------------
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write # needed by actions/attest
      attestations: write # stores the attestation
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: fetch-client.vsix

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            fetch-client.vsix \
            --generate-notes
